<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yojana Mitra</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell" id="shell">

  <div class="main">
    <header>
      <h1>🇮🇳 Yojana Mitra</h1>
      <span class="who" id="who"></span>
      <span class="spacer"></span>
      <button class="ghost" id="btn-panel" style="display:none">Panel</button>
      <button class="ghost" id="btn-profile">Profile</button>
      <button class="ghost" id="btn-reset">Reset</button>
    </header>

    <div id="log"></div>

    <div id="status" class="hidden"><span class="dot"></span><span id="status-text"></span></div>

    <div id="gate" class="hidden">
      <p id="gate-text">Ready to submit.</p>
      <div class="row">
        <button class="primary" id="btn-confirm">Confirm &amp; submit</button>
        <button class="ghost" id="btn-dismiss">Not yet</button>
      </div>
    </div>

    <form id="composer" autocomplete="off">
      <label class="upload" for="file" title="Upload a document (PDF, PNG, JPG)">📎</label>
      <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg">
      <textarea id="input" rows="1" placeholder="Ask about a scheme, or type CONFIRM to approve a submission…"></textarea>
      <button class="primary" type="submit" id="btn-send">Send</button>
    </form>
  </div>

  <aside class="side">
    <div class="section grow">
      <h2>Graph trace</h2>
      <div id="trace"><div class="empty">Nodes light up here as the state machine runs.</div></div>
    </div>
    <div class="section">
      <h2>Automation</h2>
      <div id="shots"><div class="empty">Portal screenshots appear here during an application.</div></div>
    </div>
  </aside>

</div>

<div class="overlay hidden" id="profile-overlay">
  <div class="modal">
    <header>
      <h1>Your profile</h1>
      <span class="spacer"></span>
      <button class="ghost" id="btn-profile-close">Close</button>
    </header>
    <div class="fields" id="profile-fields"></div>
    <footer>
      <span class="who" id="profile-msg" style="flex:1;align-self:center"></span>
      <button class="primary" id="btn-profile-save">Save profile</button>
    </footer>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
